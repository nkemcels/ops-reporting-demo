# nginx site for the reporting preview.
# Installed as /etc/nginx/sites-available/ops-reporting-demo.epicrallytennis.com
# (symlinked into sites-enabled). Serves the static export from
# /var/www/ops-reporting-demo; nothing else on the host is touched.
# `certbot --nginx` adds the 443 listener and certificate, as for the other sites.
server {
    listen 80;
    listen [::]:80;
    server_name ops-reporting-demo.epicrallytennis.com;

    root /var/www/ops-reporting-demo;
    index index.html;

    # Own log files so the demo's traffic stays separate and cleanup is complete.
    access_log /var/log/nginx/ops-reporting-demo.access.log;
    error_log  /var/log/nginx/ops-reporting-demo.error.log;

    # Client preview: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Static export writes /projects.html and /projects/pr01.html for clean URLs.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    error_page 404 /404.html;
}
